<svg width="100%" height="220" viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff">
        <animate attributeName="stop-color" values="#ffffff;#93c5fd;#38bdf8;#ffffff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#60a5fa">
        <animate attributeName="stop-color" values="#60a5fa;#c084fc;#60a5fa;#38bdf8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#38bdf8;#93c5fd;#a855f7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
        100% { transform: translateY(0px); }
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.9; }
      }
      @keyframes waveSlide {
        0% { transform: translateX(0); }
        100% { transform: translateX(-500px); }
      }
      .star { animation: pulseLight 3s infinite ease-in-out; }
      .wave1 { animation: waveSlide 12s linear infinite; }
      .wave2 { animation: waveSlide 8s linear infinite reverse; }
      .title-text {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: 12px;
      }
      .sub-text {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 600;
        letter-spacing: 5px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="220" rx="14" fill="url(#bgGrad)"/>
  <rect width="1000" height="220" rx="14" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Starry Cyber Particles -->
  <circle cx="80" cy="40" r="1.5" fill="#60a5fa" class="star" style="animation-delay: 0.2s;"/>
  <circle cx="150" cy="85" r="1.2" fill="#38bdf8" class="star" style="animation-delay: 1.5s;"/>
  <circle cx="230" cy="30" r="2" fill="#c084fc" class="star" style="animation-delay: 0.8s;"/>
  <circle cx="320" cy="65" r="1" fill="#93c5fd" class="star" style="animation-delay: 2.1s;"/>
  <circle cx="410" cy="35" r="1.8" fill="#60a5fa" class="star" style="animation-delay: 1.1s;"/>
  <circle cx="600" cy="45" r="1.5" fill="#38bdf8" class="star" style="animation-delay: 0.4s;"/>
  <circle cx="720" cy="25" r="2" fill="#c084fc" class="star" style="animation-delay: 1.7s;"/>
  <circle cx="830" cy="70" r="1.2" fill="#93c5fd" class="star" style="animation-delay: 0.9s;"/>
  <circle cx="910" cy="40" r="1.8" fill="#60a5fa" class="star" style="animation-delay: 2.3s;"/>
  <circle cx="960" cy="90" r="1" fill="#38bdf8" class="star" style="animation-delay: 1.4s;"/>

  <!-- Animated Bottom Waves -->
  <g opacity="0.85">
    <path class="wave2" fill="url(#waveGrad2)" d="M0,170 C150,150 350,190 500,170 C650,150 850,190 1000,170 C1150,150 1350,190 1500,170 L1500,220 L0,220 Z"/>
    <path class="wave1" fill="url(#waveGrad1)" d="M0,185 C200,165 300,200 500,185 C700,165 800,200 1000,185 C1200,165 1300,200 1500,185 L1500,220 L0,220 Z"/>
  </g>

  <!-- Glowing Title RIZYOX -->
  <g filter="url(#glow)">
    <text x="500" y="98" text-anchor="middle" fill="url(#textGrad)" font-size="58" class="title-text">RIZYOX</text>
  </g>

  <!-- Subtitle -->
  <text x="500" y="140" text-anchor="middle" fill="#94a3b8" font-size="14" class="sub-text">
    <tspan fill="#38bdf8">//</tspan> INFRASTRUCTURE <tspan fill="#64748b">•</tspan> CLOUD VIRTUALIZATION <tspan fill="#64748b">•</tspan> FULL-STACK
  </text>

  <!-- Top Accent Neon Bar -->
  <rect x="350" y="0" width="300" height="3" fill="url(#textGrad)" rx="1.5"/>
</svg>
