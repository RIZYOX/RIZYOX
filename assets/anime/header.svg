<svg width="100%" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020817"/>
      <stop offset="40%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#04091a"/>
    </linearGradient>

    <!-- Neon text gradient (animated color shift) -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#a855f7;#22d3ee;#38bdf8" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#38bdf8;#c084fc;#818cf8" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#22d3ee;#818cf8;#a855f7" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Wave gradient top -->
    <linearGradient id="waveTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Wave gradient bottom -->
    <linearGradient id="waveBot" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Glow filter for RIZYOX text -->
    <filter id="neonGlow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur2"/>
      <feColorMatrix in="blur1" type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.74  0 0 0 0 1  0 0 0 0.7 0" result="glow1"/>
      <feColorMatrix in="blur2" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.3  0 0 0 0 1  0 0 0 0.9 0" result="glow2"/>
      <feMerge>
        <feMergeNode in="glow1"/>
        <feMergeNode in="glow2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle glow for subtitle -->
    <filter id="subtleGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes waveLeft {
        from { transform: translateX(0); }
        to   { transform: translateX(-600px); }
      }
      @keyframes waveRight {
        from { transform: translateX(0); }
        to   { transform: translateX(600px); }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; r: 1.5px; }
        50%       { opacity: 1;   r: 2.5px; }
      }
      @keyframes scanline {
        0%   { transform: translateY(-5px); opacity: 0; }
        10%  { opacity: 0.06; }
        90%  { opacity: 0.06; }
        100% { transform: translateY(260px); opacity: 0; }
      }
      @keyframes titleFloat {
        0%, 100% { transform: translateY(0); }
        50%       { transform: translateY(-4px); }
      }
      @keyframes barPulse {
        0%, 100% { opacity: 0.6; }
        50%       { opacity: 1; }
      }
      .w1 { animation: waveLeft  14s linear infinite; }
      .w2 { animation: waveRight 10s linear infinite; }
      .star { animation: twinkle 3s ease-in-out infinite; }
      .scan { animation: scanline 4s linear infinite; }
      .title { animation: titleFloat 5s ease-in-out infinite; }
      .bar   { animation: barPulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- ─── Background ─── -->
  <rect width="1200" height="260" fill="url(#bgGrad)"/>

  <!-- ─── Scanline effect ─── -->
  <rect class="scan" x="0" y="0" width="1200" height="3" fill="#60a5fa" opacity="0.06"/>

  <!-- ─── Twinkling stars ─── -->
  <circle class="star" cx="60"   cy="30"  r="1.5" fill="#93c5fd" style="animation-delay:0s"/>
  <circle class="star" cx="160"  cy="65"  r="1.2" fill="#c084fc" style="animation-delay:0.8s"/>
  <circle class="star" cx="250"  cy="22"  r="2"   fill="#38bdf8" style="animation-delay:1.4s"/>
  <circle class="star" cx="380"  cy="55"  r="1"   fill="#818cf8" style="animation-delay:0.3s"/>
  <circle class="star" cx="480"  cy="18"  r="1.8" fill="#60a5fa" style="animation-delay:2s"/>
  <circle class="star" cx="700"  cy="40"  r="1.5" fill="#38bdf8" style="animation-delay:0.6s"/>
  <circle class="star" cx="820"  cy="20"  r="2"   fill="#c084fc" style="animation-delay:1.9s"/>
  <circle class="star" cx="960"  cy="60"  r="1.2" fill="#93c5fd" style="animation-delay:1.1s"/>
  <circle class="star" cx="1090" cy="32"  r="1.8" fill="#60a5fa" style="animation-delay:2.5s"/>
  <circle class="star" cx="1160" cy="75"  r="1"   fill="#38bdf8" style="animation-delay:0.5s"/>
  <circle class="star" cx="130"  cy="180" r="1.3" fill="#818cf8" style="animation-delay:1.2s"/>
  <circle class="star" cx="550"  cy="195" r="1.5" fill="#60a5fa" style="animation-delay:0.7s"/>
  <circle class="star" cx="900"  cy="175" r="1"   fill="#c084fc" style="animation-delay:1.6s"/>
  <circle class="star" cx="1050" cy="200" r="1.8" fill="#38bdf8" style="animation-delay:2.2s"/>

  <!-- ─── Horizontal neon top accent line ─── -->
  <rect class="bar" x="380" y="52" width="440" height="2.5" rx="1.25" fill="url(#textGrad)"/>

  <!-- ─── RIZYOX main title (animated float + glow) ─── -->
  <g class="title" filter="url(#neonGlow)">
    <text
      x="600" y="158"
      text-anchor="middle"
      fill="url(#textGrad)"
      font-family="'Space Grotesk', 'Segoe UI', Arial Black, sans-serif"
      font-size="88"
      font-weight="900"
      letter-spacing="18"
    >RIZYOX</text>
  </g>

  <!-- ─── Subtitle line ─── -->
  <g filter="url(#subtleGlow)">
    <text
      x="600" y="196"
      text-anchor="middle"
      fill="#64748b"
      font-family="'JetBrains Mono', 'Courier New', monospace"
      font-size="13"
      font-weight="600"
      letter-spacing="5"
    >
      <tspan fill="#38bdf8">// </tspan>INFRASTRUCTURE<tspan fill="#334155"> · </tspan>CLOUD VIRTUALIZATION<tspan fill="#334155"> · </tspan>FULL-STACK
    </text>
  </g>

  <!-- ─── Bottom horizontal accent line ─── -->
  <rect class="bar" x="380" y="214" width="440" height="2" rx="1" fill="url(#textGrad)" opacity="0.6" style="animation-delay:1.5s"/>

  <!-- ─── Animated bottom waves ─── -->
  <g opacity="0.8">
    <path class="w2" fill="url(#waveBot)"
      d="M0,235 C200,218 400,252 600,235 C800,218 1000,252 1200,235 C1400,218 1600,252 1800,235 L1800,260 L0,260 Z"/>
    <path class="w1" fill="url(#waveTop)"
      d="M0,246 C250,228 450,262 600,246 C750,228 950,262 1200,246 C1450,228 1650,262 1800,246 L1800,260 L0,260 Z"/>
  </g>
</svg>
