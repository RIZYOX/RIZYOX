<svg width="100%" height="100" viewBox="0 0 1000 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.8"/>
    </linearGradient>
    <style>
      @keyframes footSlide {
        0% { transform: translateX(0); }
        100% { transform: translateX(-500px); }
      }
      .foot-wave { animation: footSlide 10s linear infinite; }
    </style>
  </defs>
  <path class="foot-wave" fill="url(#footerWave)" d="M0,40 C150,20 350,60 500,40 C650,20 850,60 1000,40 C1150,20 1350,60 1500,40 L1500,100 L0,100 Z"/>
</svg>
