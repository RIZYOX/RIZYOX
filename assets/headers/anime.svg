<svg width="100%" height="56" viewBox="0 0 1200 56" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="40%" stop-color="#0f1f3d"/>
      <stop offset="100%" stop-color="#1a0a3d"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b0f1a" stop-opacity="0"/>
      <stop offset="30%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#a855f7;#3b82f6" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="70%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#3b82f6;#a855f7" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1a0a3d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="textg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0">
        <animate attributeName="stop-color" values="#e2e8f0;#93c5fd;#e2e8f0" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#c4b5fd">
        <animate attributeName="stop-color" values="#c4b5fd;#e2e8f0;#c4b5fd" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes slideIn { from { opacity:0; transform:translateX(-20px); } to { opacity:1; transform:translateX(0); } }
      .title { animation: slideIn 0.8s ease-out both; }
    </style>
  </defs>
  <rect width="1200" height="56" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="1" fill="#1e293b"/>
  <rect x="0" y="53" width="1200" height="3" fill="url(#line)" rx="1.5"/>
  <rect x="48" y="16" width="3" height="24" fill="#3b82f6" rx="1.5" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
  </rect>
  <text class="title" x="64" y="34" fill="url(#textg)" font-family="'Segoe UI',Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="5" filter="url(#glow)">FAVORITE ANIME</text>
  <circle cx="1130" cy="28" r="2.5" fill="#3b82f6" opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="1145" cy="28" r="2.5" fill="#6366f1" opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle>
  <circle cx="1160" cy="28" r="2.5" fill="#a855f7" opacity="0.6"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle>
</svg>